<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="orange">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>TOEIC homework</title>

<!-- Inline so the page stays self-contained and the browser stops requesting
     a /favicon.ico that is not there. Bright accent fill with the darkened
     same-hue ink, per the system's rule for bright fills. -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23FF3503'/><path d='M9 16.5l5 5 9-10' fill='none' stroke='%233d0f00' stroke-width='3.6' stroke-linecap='round' stroke-linejoin='round'/></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500&display=swap" rel="stylesheet">

<script>
/* Theme before first paint. Same rules as the site's shared.js: dark is the
   default, an explicit OS light preference wins. localStorage throws inside a
   sandboxed iframe, so every access is guarded. */
(function(){
  var saved = null;
  try { saved = localStorage.getItem('gm_theme'); } catch(e) {}
  var t = (saved === 'light' || saved === 'dark') ? saved
        : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', t);
})();
</script>

<style>
/* ==========================================================================
   GrammarMetric "electric" design system — tokens restated inline, matching
   the PT1 score report so a student moving between the two pages sees one
   system. Standalone deliverable, so no shared.css link.
   ========================================================================== */
:root{
  --gm-yellow:#FFFC00;  --gm-yellow-text:#736f00;
  --gm-cyan:#00FFFF;    --gm-cyan-text:#004d4d;  --gm-cyan-outline:#006666;
  --gm-orange:#FF3503;  --gm-orange-text:#3d0f00;
  --gm-magenta:#FF00FF; --gm-magenta-text:#500050;
  --gm-error:#ff5252;   --gm-error-text:#4a0d0d;

  --rgb-cyan:0,255,255;  --rgb-orange:255,53,3;  --rgb-error:255,82,82;

  --radius-card:14px; --radius-control:10px; --radius-pill:20px; --radius-badge:9px;
  --font:'Lexend', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --gap:18px; --pad-card:24px;
}
:root, :root[data-theme="dark"]{
  /* Native controls read this. Without it the tracker's unchecked boxes render
     as solid white squares on the black card. */
  color-scheme:dark;
  --bg:#050505; --text:#ffffff;
  --muted:rgba(255,255,255,0.55);
  --card:rgba(255,255,255,0.04);
  --line:rgba(255,255,255,0.08);
  --line-strong:rgba(255,255,255,0.16);
  --accent-ink:var(--accent);
  --ok-ink:var(--gm-cyan);
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#ffffff; --text:#050505;
  --muted:rgba(5,5,5,0.62);        /* site deviation: 0.55 fails on tints */
  --card:rgba(5,5,5,0.03);
  --line:rgba(5,5,5,0.08);
  --line-strong:rgba(5,5,5,0.16);
  --accent-ink:var(--accent-text);
  --ok-ink:var(--gm-cyan-outline);
}
:root, :root[data-accent="orange"]{
  --accent:var(--gm-orange); --accent-text:var(--gm-orange-text);
  --accent-rgb:var(--rgb-orange);
}

*{box-sizing:border-box; margin:0; padding:0;}
html{font-family:var(--font);}          /* root, or it falls back to Times */
body{background:var(--bg); color:var(--text); font-family:var(--font);
  font-weight:400; font-size:16px; line-height:1.6;
  -webkit-text-size-adjust:100%;}
b,strong{font-weight:500;}              /* or the browser uses 700 */
h1,h2,h3{font-weight:500; line-height:1.3;}

.wrap{max-width:880px; margin:0 auto; padding:28px 18px 64px;}

/* ---------- masthead ---------- */
.masthead{margin-bottom:26px; position:relative;}
.eyebrow{font-size:13px; color:var(--accent-ink); letter-spacing:.2px;}
.masthead h1{font-size:26px; margin:6px 0 4px;}
.who{font-size:15px; color:var(--muted);}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
.chip{font-size:13px; padding:5px 13px; border-radius:var(--radius-pill);
  background:rgba(var(--accent-rgb),0.12); color:var(--accent-ink);
  border:1px solid var(--line);}
.chip.lead{background:var(--accent); color:var(--accent-text);
  border-color:transparent; font-weight:500;}

/* ---------- cards: one model only ---------- */
.card{background:var(--card); border:1px solid var(--line);
  border-radius:var(--radius-card); padding:var(--pad-card); margin-bottom:var(--gap);}
.card h2{font-size:19px; margin-bottom:6px;}
.card h3{font-size:15.5px; margin:22px 0 10px;}
.lede{font-size:14.5px; color:var(--muted); margin-bottom:18px;}
p.note{font-size:14px; color:var(--muted); margin-top:14px;}
.card > p + p{margin-top:10px;}

/* ---------- stat tiles ---------- */
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:12px;
  margin-bottom:var(--gap);}
.tile{background:var(--card); border:1px solid var(--line);
  border-radius:var(--radius-card); padding:16px 18px;}
.tile .lbl{font-size:13px; color:var(--muted);}
.tile .val{font-size:32px; font-weight:500; line-height:1.2; margin-top:4px;}
.tile .val small{font-size:15px; color:var(--muted);}
.tile .sub{font-size:13px; color:var(--muted); margin-top:3px;}
.tile.hero{background:rgba(var(--accent-rgb),0.10);
  border-color:rgba(var(--accent-rgb),0.28);}
.tile.hero .val{font-size:42px; color:var(--accent-ink);}

/* ---------- evidence rows: the numbers behind the week ---------- */
.ev{display:grid; grid-template-columns:1fr auto; gap:6px 16px; align-items:baseline;
  padding:12px 0; border-bottom:1px solid var(--line);}
.ev:last-child{border-bottom:0; padding-bottom:0;}
.ev .evl{font-size:15px;}
.ev .evv{font-size:15px; font-weight:500; color:var(--accent-ink);
  font-variant-numeric:tabular-nums; white-space:nowrap;}
.ev .evn{grid-column:1 / -1; font-size:14px; color:var(--muted); margin-top:-4px;}

/* ---------- assignment ---------- */
.asg{background:var(--card); border:1px solid var(--line);
  border-radius:var(--radius-card); padding:var(--pad-card); margin-bottom:var(--gap);}
.asg-head{display:flex; align-items:flex-start; gap:14px; margin-bottom:4px;}
/* icon badge: bright accent fill, darkened same-hue ink, 9px radius — both modes */
.asg-num{flex:0 0 auto; width:34px; height:34px; border-radius:var(--radius-badge);
  background:var(--accent); color:var(--accent-text); font-size:16px; font-weight:500;
  display:flex; align-items:center; justify-content:center; margin-top:2px;}
.asg-head h2{font-size:19px;}
.asg-meta{display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 18px 48px;}
.asg-intro{margin-left:48px;}
@media (max-width:560px){ .asg-meta,.asg-intro{margin-left:0;} }

ol.steps{list-style:none; counter-reset:s; margin-top:16px;}
ol.steps li{counter-increment:s; position:relative; padding:0 0 18px 46px;}
ol.steps li:last-child{padding-bottom:0;}
ol.steps li::before{content:counter(s); position:absolute; left:0; top:1px;
  width:30px; height:30px; border-radius:var(--radius-badge);
  background:rgba(var(--accent-rgb),0.14); color:var(--accent-ink); font-size:14px;
  font-weight:500; display:flex; align-items:center; justify-content:center;}

/* ---------- finding callout: why this assignment exists ---------- */
.finding{background:rgba(var(--accent-rgb),0.08);
  border:1px solid rgba(var(--accent-rgb),0.20);
  border-radius:var(--radius-card); padding:17px 19px; margin:18px 0 0;}
.finding .ft{font-size:13px; color:var(--accent-ink); margin-bottom:6px;}
.finding p + p{margin-top:10px;}
.target{margin-top:14px; padding-top:12px; border-top:1px solid var(--line);
  font-size:14px; color:var(--muted);}
.target b{color:var(--text);}

/* ---------- tracker ---------- */
.trk{width:100%; border-collapse:collapse; margin-top:6px; font-size:14px;}
.trk th,.trk td{padding:9px 4px; border-bottom:1px solid var(--line); text-align:center;}
.trk th:first-child,.trk td:first-child{text-align:left; padding-left:0;
  font-size:14px; min-width:120px;}
.trk thead th{color:var(--muted); font-weight:400; font-size:12.5px;}
/* the footer already draws a rule, so the last row must not draw a second */
.trk tbody tr:last-child td{border-bottom:0;}
.trkwrap{overflow-x:auto;}
.trk input[type="checkbox"]{width:22px; height:22px; accent-color:var(--accent);
  cursor:pointer; margin:0;}
.trk td.na{color:var(--muted); font-size:13px;}
.trk-foot{display:flex; flex-wrap:wrap; align-items:center; gap:14px; margin-top:16px;
  padding-top:14px; border-top:1px solid var(--line);}
.trk-done{font-size:14px; color:var(--muted);}
.trk-done b{color:var(--accent-ink);}

ul.wins{list-style:none;}
ul.wins li{position:relative; padding:0 0 10px 20px; font-size:15px;}
ul.wins li:last-child{padding-bottom:0;}
ul.wins li::before{content:""; position:absolute; left:0; top:10px; width:6px;
  height:6px; border-radius:50%; background:var(--accent-ink);}

.foot{font-size:12.5px; color:var(--muted); text-align:center; margin-top:10px;}
.btn{font-family:inherit; font-size:14.5px; font-weight:400; padding:11px 20px;
  border:1px solid var(--line-strong); background:transparent; color:var(--text);
  border-radius:var(--radius-control); cursor:pointer; min-height:44px;}
.btn:hover{border-color:var(--accent-ink); color:var(--accent-ink);}
.btn:focus-visible{outline:2px solid var(--accent-ink); outline-offset:2px;}
.themebtn{position:absolute; top:0; right:0; width:40px; height:40px;
  padding:0; font-size:15px;}

@media (max-width:560px){
  .masthead h1{font-size:22px; padding-right:46px;}
  .tile .val{font-size:28px;} .tile.hero .val{font-size:34px;}
  .card,.asg{padding:18px;}
}
@media print{
  .btn{display:none;}
  .card,.asg{page-break-inside:avoid; border-color:#bbb;}
  .finding{page-break-inside:avoid;}
}
</style>
</head>
<body>
<div class="wrap">

<div class="masthead">
  <button class="btn themebtn" id="themeToggle" aria-label="Switch to light mode">&#9788;</button>
  <div class="eyebrow">GrammarMetric &middot; TOEIC</div>
  <h1 id="title">Homework</h1>
  <div class="who" id="who"></div>
  <div class="chips" id="chips"></div>
</div>

<div class="tiles" id="tiles"></div>

<section class="card" id="why"></section>
<section id="assignments"></section>
<section class="card" id="tracker"></section>
<section class="card" id="bring"></section>

<p class="foot" id="foot"></p>

</div>

<script>
/* ============================================================================
   One week of homework for one student. No answer key and no test content —
   only the student's own per-part percentages, which they have already seen on
   their score report.
   Generated from _build/template.html by _build/build.mjs. Do not edit this
   file directly; edit the template or the student's JSON and rebuild.
   ============================================================================ */
const HW = {"slug":"jeen","nick":"Jeen","class":"3","weekOf":"2026-08-10","weekLabel":"10 August 2026","dailyLoad":"About 30 minutes a day","focus":["Grammar words","Double passages","Listening gist"],"tiles":[{"lbl":"This week","val":"3","sub":"assignments, five days"},{"lbl":"Your estimate now","val":"425<small>–565</small>","sub":"listening 65 · reading 48"},{"lbl":"Your clearest gap","val":"37<small>pts</small>","sub":"grammar words vs vocabulary"}],"why":{"lede":"You have the strongest listening in the group, and something in your results that nobody else managed: you never lost a whole recording. Every single conversation and talk gave you at least one mark. What your test shows is not general weakness — it is two very specific things and one unusual habit. Specific is good. Specific is fixable.","points":[{"label":"Part 5: grammar words vs vocabulary","value":"23% vs 60%","note":"Your vocabulary is a genuine strength. Prepositions, conjunctions and pronouns are not — yet. This is the clearest single gap anyone in the group has."},{"label":"Part 7: one document vs two","value":"68% vs 30%","note":"Single passages are working well. The moment a question spans two documents, it falls away."},{"label":"Reading time used","value":"81 of 75 min","note":"Six minutes over — and the double passages are the last twenty questions on the paper. That may be part of the story above, and we should find out."},{"label":"Where your listening marks fall","value":"50% first, 80% last","note":"The reverse of most students. You catch the detail and miss the frame. Genuinely unusual, and worth a week of attention."}]},"assignments":[{"title":"Grammar words only, fifteen a day","short":"Grammar words","tag":"Reading","dose":"15 items a day","time":"~15 min","days":["Mon","Tue","Wed","Thu","Fri"],"intro":"Not mixed sets this week. Prepositions, conjunctions and relative pronouns, and nothing else.","steps":["<b>Fifteen Part 5 items</b> — only the ones where the four options are grammar words: <i>among / whether / who / despite</i> and friends. Skip the vocabulary and word-form ones.","<b>Answer them.</b>","<b>For each question, write why each of the three wrong options is wrong.</b> All three. This is the actual exercise — the answering part is just setup.","<b>Keep one running list</b> all week of the prepositions that catch you out. Same page, added to each day."],"why":["You got 9 out of 15 vocabulary questions and <b>3 out of 13 grammar-word questions</b> on the same paper. That is a 37-point gap in one part of one section, and it is the clearest thing anyone's test showed.","It is also the one place in this whole group where drilling a single narrow thing beats mixed practice, because the rest of your Part 5 is already working. Step 3 is why: with grammar words the wrong options are wrong for a reason you can actually state out loud, unlike vocabulary where you either know the word or you do not. Say the reason and the rule sticks.","One honest caveat: this is 13 questions on one test. It is enough to act on for a week — it is not enough to rebuild your whole study plan around, so we will check it against your next test before going further."],"target":"23% climbing towards 45%, and a list of at least six prepositions you now know cold."},{"title":"Double passages, twice each","short":"Double passages","tag":"Reading","dose":"2 sets","time":"~40 min total","days":["Tue","Sat"],"intro":"One set untimed early in the week, a different set under the clock later. The order matters — do not swap it.","steps":["<b>Take a double-passage set. No timer.</b> Take as long as you want on this first one.","<b>Before answering, label each of the five questions:</b> text 1, text 2, or both. Just the label, before you go hunting.","<b>Answer, then check</b> — and note whether the ones you missed were the &ldquo;both&rdquo; questions or not. That answer is the whole experiment.","<b>Later in the week, do a second set with a 12-minute timer</b> and compare."],"why":["You scored 68% on single passages and 30% on doubles. There are two quite different explanations and we cannot yet tell them apart: either cross-referencing two documents is genuinely hard for you, or you simply arrived at question 181 with almost no time left, having run six minutes over. Doing one untimed settles it in forty minutes.","The labelling step teaches the mechanic itself. Usually only about one question in a five-question set truly needs both documents — the other four are answerable from one text. Students who know that stop re-reading everything twice.","We have not covered Part 7 in class yet, so treat this as learning something new rather than repairing something broken. A low score on an untaught part is information, not a verdict."],"target":"A clear answer to which of the two causes it is — that is worth more this week than the score itself."},{"title":"Gist first, options covered","short":"Gist listening","tag":"Listening","dose":"5 sets across the week","time":"~10 min each","days":["Mon","Tue","Wed","Thu","Fri"],"intro":"A short one, aimed at the single oddest thing in your results.","steps":["<b>Cover the questions and the options completely.</b> Paper over the page, or scroll them off screen. Play the recording once.","<b>Say out loud, or write in one sentence:</b> who is talking, where they are, and why they are talking.","<b>Only now uncover the questions</b> and answer them normally.","<b>Check your summary too</b>, not just your answers. Was the situation what you thought it was?"],"why":["You score 80% on the last question of each set and 50% on the first. Almost every student is the other way round, which makes this genuinely your own pattern: you are catching the details but not the situation they sit in.","That matters more than it sounds, because the first question in a Part 3 or Part 4 set is nearly always topic, purpose, or who is speaking. Across the whole listening section that is around twenty marks sitting in one question type you are getting half right.","Covering the options is the part that does the work. With the options visible it is too easy to match a word you heard; with them hidden you have to actually build the picture."],"target":"Your first-question accuracy up from 50% towards 70%, and a summary that matches the recording four times out of five."}],"bringLede":"Bring these three. The second one especially — it answers a question I cannot answer without you.","bring":["Your running list of prepositions from the grammar-word sets","The labelled double-passage set, and whether doing it untimed actually helped","Two of your gist summaries — one that was right and one that was wrong"]};

const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* ---------- masthead ---------- */
document.title = "TOEIC homework — " + HW.nick;
document.getElementById("title").textContent = "This week's homework";
document.getElementById("who").textContent =
  HW.nick + " · Class " + HW.class + " · Week of " + HW.weekLabel;
document.getElementById("chips").innerHTML =
  '<span class="chip lead">' + esc(HW.dailyLoad) + "</span>" +
  HW.focus.map(f => '<span class="chip">' + esc(f) + "</span>").join("");

/* ---------- tiles ---------- */
document.getElementById("tiles").innerHTML = HW.tiles.map((t,i) =>
  '<div class="tile' + (i === 0 ? " hero" : "") + '">' +
    '<div class="lbl">' + esc(t.lbl) + "</div>" +
    '<div class="val">' + t.val + "</div>" +
    '<div class="sub">' + esc(t.sub) + "</div>" +
  "</div>").join("");

/* ---------- why these three ---------- */
document.getElementById("why").innerHTML =
  "<h2>Why these three</h2>" +
  '<p class="lede">' + HW.why.lede + "</p>" +
  HW.why.points.map(p =>
    '<div class="ev"><div class="evl">' + p.label + "</div>" +
    '<div class="evv">' + esc(p.value) + "</div>" +
    '<div class="evn">' + p.note + "</div></div>").join("");

/* ---------- the assignments ---------- */
document.getElementById("assignments").innerHTML = HW.assignments.map((a,i) =>
  '<article class="asg">' +
    '<div class="asg-head"><div class="asg-num">' + (i+1) + "</div>" +
      "<h2>" + esc(a.title) + "</h2></div>" +
    '<div class="asg-meta">' +
      '<span class="chip">' + esc(a.tag) + "</span>" +
      '<span class="chip">' + esc(a.dose) + "</span>" +
      '<span class="chip">' + esc(a.time) + "</span>" +
    "</div>" +
    '<div class="asg-intro"><p>' + a.intro + "</p>" +
    "<ol class=\"steps\">" + a.steps.map(s => "<li>" + s + "</li>").join("") + "</ol>" +
    '<div class="finding"><div class="ft">Why this one</div><p>' +
      a.why.join("</p><p>") + "</p></div>" +
    '<p class="target"><b>What good looks like by Friday:</b> ' + a.target + "</p>" +
    "</div>" +
  "</article>").join("");

/* ---------- tracker ----------
   Ticks live in this browser only, like the lesson pages. A different phone or
   a cleared cache starts fresh, so the page says so rather than losing work
   silently. */
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const KEY  = "gm_hw_" + HW.slug + "_" + HW.weekOf;
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e) { state = {}; }

const totalBoxes = HW.assignments.reduce((n,a) => n + a.days.length, 0);

document.getElementById("tracker").innerHTML =
  "<h2>Tick it off</h2>" +
  '<p class="lede">One tick per session. Ticks are saved in this browser only, ' +
  "so use the same phone or laptop each time.</p>" +
  '<div class="trkwrap"><table class="trk"><thead><tr><th>Task</th>' +
    DAYS.map(d => "<th>" + d + "</th>").join("") + "</tr></thead><tbody>" +
  HW.assignments.map((a,i) =>
    "<tr><td>" + esc(a.short) + "</td>" +
    DAYS.map(d => a.days.indexOf(d) === -1
      ? '<td class="na">&ndash;</td>'
      : '<td><input type="checkbox" data-k="' + i + d + '" aria-label="' +
        esc(a.short) + ", " + d + '"></td>').join("") +
    "</tr>").join("") +
  "</tbody></table></div>" +
  '<div class="trk-foot"><span class="trk-done" id="trkDone"></span>' +
  '<button class="btn" id="trkReset">Clear this week</button></div>';

const boxes = [...document.querySelectorAll(".trk input")];
function paint(){
  boxes.forEach(b => { b.checked = !!state[b.dataset.k]; });
  const n = boxes.filter(b => b.checked).length;
  document.getElementById("trkDone").innerHTML =
    "<b>" + n + " of " + totalBoxes + "</b> sessions done";
}
boxes.forEach(b => b.addEventListener("change", () => {
  state[b.dataset.k] = b.checked;
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {}
  paint();
}));
document.getElementById("trkReset").addEventListener("click", () => {
  state = {};
  try { localStorage.removeItem(KEY); } catch(e) {}
  paint();
});
paint();

/* ---------- bring to class ---------- */
document.getElementById("bring").innerHTML =
  "<h2>Bring to class</h2>" +
  '<p class="lede">' + HW.bringLede + "</p><ul class=\"wins\">" +
  HW.bring.map(b => "<li>" + b + "</li>").join("") + "</ul>";

document.getElementById("foot").textContent =
  "GrammarMetric · built from your practice test 1 results · " + HW.weekLabel;

/* ---------- theme toggle ---------- */
const tbtn = document.getElementById("themeToggle");
function syncBtn(){
  const dark = document.documentElement.getAttribute("data-theme") === "dark";
  tbtn.textContent = dark ? "☼" : "☾";
  tbtn.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
}
tbtn.addEventListener("click", () => {
  const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("gm_theme", next); } catch(e) {}
  syncBtn();
});
syncBtn();
</script>
</body>
</html>
