<title>TOEIC homework</title>

<!-- Inline so the page stays self-contained and the browser stops requesting
     a /favicon.ico that is not there. Bright accent fill with the darkened
     same-hue ink, per the guide's rule for bright fills. -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23FF3503'/><path d='M9 16.5l5 5 9-10' fill='none' stroke='%233d0f00' stroke-width='3.6' stroke-linecap='round' stroke-linejoin='round'/></svg>">

<script>
/* Theme before first paint. Dark is the default; an explicit OS light
   preference wins. localStorage throws inside a sandboxed iframe, so every
   access is guarded. */
(function(){
  var saved = null;
  try { saved = localStorage.getItem('gm_theme'); } catch(e) {}
  var t = (saved === 'light' || saved === 'dark') ? saved
        : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', t);
})();
</script>

<style>
/* ==========================================================================
   GrammarMetric "electric" design system.

   COLOUR STRATEGY, and why this page uses all four accents.
   The guide says one lead accent per screen and warns that running all four
   together is the loudest possible use of the palette — "sparingly and
   deliberately, not as the default pattern". This page spends that budget
   deliberately, once: the three assignments are the whole point of the page,
   so each one carries its own accent and every element inside it inherits
   that accent. The colour is a legend, not decoration — the tracker row and
   the card agree, so a student can find "the cyan one" at a glance.

   Page chrome (masthead, hero, tracker, bring-to-class) stays orange, the
   site's TOEIC accent, so the three assignment colours never compete with a
   fifth.

   Large areas are TINTED at 8-16% of the accent hue rather than filled, per
   the guide. Full saturation is reserved for small single-purpose elements:
   the eyebrow pill, the hero tile, and one number badge per assignment.
   ========================================================================== */
:root{
  --gm-yellow:#FFFC00;  --gm-yellow-text:#736f00;
  --gm-cyan:#00FFFF;    --gm-cyan-text:#004d4d;
  --gm-orange:#FF3503;  --gm-orange-text:#3d0f00;
  --gm-magenta:#FF00FF; --gm-magenta-text:#500050;
  --gm-error:#ff5252;   --gm-error-text:#4a0d0d;

  --radius-card:14px; --radius-control:10px; --radius-pill:20px; --radius-badge:9px;
  --font:'Lexend', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --gap:18px; --pad-card:24px;
}

/* ---- the four accent sets ----
   Each block declares the hue AND its darkened same-hue ink, so any element
   carrying data-accent becomes a self-contained colour scope. --accent-text is
   the guide's mandatory text colour on a bright fill of that hue, in BOTH
   modes. --accent-text-rgb exists so light mode can draw a hairline in the
   darkened hue: a 30% tint of #FFFC00 is invisible on white. */
[data-accent="orange"] {--accent:var(--gm-orange);  --accent-text:var(--gm-orange-text);
                        --accent-rgb:255,53,3;   --accent-text-rgb:61,15,0;}
[data-accent="yellow"] {--accent:var(--gm-yellow);  --accent-text:var(--gm-yellow-text);
                        --accent-rgb:255,252,0;  --accent-text-rgb:115,111,0;}
[data-accent="cyan"]   {--accent:var(--gm-cyan);    --accent-text:var(--gm-cyan-text);
                        --accent-rgb:0,255,255;  --accent-text-rgb:0,77,77;}
[data-accent="magenta"]{--accent:var(--gm-magenta); --accent-text:var(--gm-magenta-text);
                        --accent-rgb:255,0,255;  --accent-text-rgb:80,0,80;}

/* On the page or on a tint, the safe ink flips with the mode. This has to be
   declared on the same elements that declare --accent, or it resolves once at
   :root and every card inherits the root's orange. */
[data-accent]{--accent-ink:var(--accent);}
:root[data-theme="light"],
:root[data-theme="light"] [data-accent]{--accent-ink:var(--accent-text);}

:root, :root[data-theme="dark"]{
  /* Native controls read this. Without it the tracker's unchecked boxes
     render as solid white squares on the black card. */
  color-scheme:dark;
  --bg:#050505; --text:#ffffff;
  --muted:rgba(255,255,255,0.55);
  --card:rgba(255,255,255,0.04);
  --line:rgba(255,255,255,0.08);
  --line-strong:rgba(255,255,255,0.16);
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#ffffff; --text:#050505;
  --muted:rgba(5,5,5,0.62);        /* 0.55 fails on the accent tints below */
  --card:rgba(5,5,5,0.03);
  --line:rgba(5,5,5,0.08);
  --line-strong:rgba(5,5,5,0.16);
}

*{box-sizing:border-box; margin:0; padding:0;}
html{font-family:var(--font);}          /* root, or it falls back to Times */
body{background:var(--bg); color:var(--text); font-family:var(--font);
  font-weight:400; font-size:16px; line-height:1.6;
  -webkit-text-size-adjust:100%;}
b,strong{font-weight:500;}              /* or the browser uses 700 */
h1,h2,h3{font-weight:500; line-height:1.3;}
i,em{font-style:italic;}

.wrap{max-width:900px; margin:0 auto; padding:26px 18px 64px;}

/* ---------- masthead ---------- */
.masthead{margin-bottom:24px; position:relative;}
/* the one bright mark at the very top — small, single-purpose, on-spec */
.eyebrow{display:inline-block; font-size:12.5px; font-weight:500;
  padding:5px 13px; border-radius:var(--radius-pill);
  background:var(--accent); color:var(--accent-text);}
.masthead h1{font-size:40px; margin:16px 0 6px; letter-spacing:-0.5px;}
.who{font-size:15px; color:var(--muted);}
.rule{height:4px; border-radius:2px; background:var(--accent); margin:18px 0 0;
  max-width:120px;}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:16px;}
.chip{font-size:13px; padding:5px 13px; border-radius:var(--radius-pill);
  background:rgba(var(--accent-rgb),0.14); color:var(--accent-ink);
  border:1px solid rgba(var(--accent-rgb),0.26);}
:root[data-theme="light"] .chip{background:rgba(var(--accent-rgb),0.20);
  border-color:rgba(var(--accent-text-rgb),0.22);}
.chip.solid{background:var(--accent); color:var(--accent-text);
  border-color:transparent; font-weight:500;}
:root[data-theme="light"] .chip.solid{background:var(--accent);
  border-color:transparent;}

/* ---------- stat tiles ---------- */
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px;
  margin-bottom:26px;}
.tile{background:var(--card); border:1px solid var(--line);
  border-radius:var(--radius-card); padding:18px 20px;}
.tile .lbl{font-size:12.5px; color:var(--muted); text-transform:none;}
.tile .val{font-size:34px; font-weight:500; line-height:1.15; margin-top:6px;
  color:var(--accent-ink); font-variant-numeric:tabular-nums;}
.tile .val small{font-size:16px; color:var(--muted); font-weight:400;}
.tile .sub{font-size:13px; color:var(--muted); margin-top:4px;}
/* the page's single loudest element: full accent fill, darkened same-hue ink */
.tile.hero{background:var(--accent); border-color:transparent;}
.tile.hero .lbl,.tile.hero .sub{color:var(--accent-text); opacity:.78;}
.tile.hero .val{font-size:52px; color:var(--accent-text);}
.tile.hero .val small{color:var(--accent-text); opacity:.7;}

/* ---------- cards ---------- */
.card{background:var(--card); border:1px solid var(--line);
  border-radius:var(--radius-card); padding:var(--pad-card); margin-bottom:var(--gap);}
.card h2{font-size:21px; margin-bottom:6px;}
.lede{font-size:14.5px; color:var(--muted); margin-bottom:18px;}

/* ---------- evidence rows ---------- */
.ev{display:grid; grid-template-columns:1fr auto; gap:6px 16px; align-items:baseline;
  padding:13px 0; border-bottom:1px solid var(--line);}
.ev:last-child{border-bottom:0; padding-bottom:0;}
.ev .evl{font-size:15px;}
.ev .evv{font-size:14px; font-weight:500; white-space:nowrap;
  font-variant-numeric:tabular-nums; padding:3px 11px;
  border-radius:var(--radius-pill);
  background:rgba(var(--accent-rgb),0.16); color:var(--accent-ink);}
:root[data-theme="light"] .ev .evv{background:rgba(var(--accent-rgb),0.22);}
.ev .evn{grid-column:1 / -1; font-size:14px; color:var(--muted); margin-top:-2px;}

/* ---------- assignment: one accent scope per card ---------- */
.asg{border-radius:var(--radius-card); padding:var(--pad-card); margin-bottom:var(--gap);
  background:rgba(var(--accent-rgb),0.08);
  border:1px solid rgba(var(--accent-rgb),0.30);}
:root[data-theme="light"] .asg{background:rgba(var(--accent-rgb),0.16);
  border-color:rgba(var(--accent-text-rgb),0.28);}
.asg-head{display:flex; align-items:flex-start; gap:15px; margin-bottom:4px;}
/* icon badge, guide spec: bright accent fill, darkened-hue ink, 9px radius */
.asg-num{flex:0 0 auto; width:40px; height:40px; border-radius:var(--radius-badge);
  background:var(--accent); color:var(--accent-text); font-size:19px; font-weight:500;
  display:flex; align-items:center; justify-content:center; margin-top:1px;}
.asg-head h2{font-size:22px; padding-top:4px;}
.asg-meta{display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 18px 55px;}
.asg-body{margin-left:55px;}
@media (max-width:600px){ .asg-meta,.asg-body{margin-left:0;} }

ol.steps{list-style:none; counter-reset:s; margin-top:18px;}
ol.steps li{counter-increment:s; position:relative; padding:0 0 18px 44px;}
ol.steps li:last-child{padding-bottom:0;}
ol.steps li::before{content:counter(s); position:absolute; left:0; top:1px;
  width:29px; height:29px; border-radius:var(--radius-badge);
  background:rgba(var(--accent-rgb),0.22); color:var(--accent-ink); font-size:14px;
  font-weight:500; display:flex; align-items:center; justify-content:center;}
:root[data-theme="light"] ol.steps li::before{background:rgba(var(--accent-rgb),0.30);}

/* ---------- audio ----------
   Reads as an inset device panel rather than more prose, so the play targets
   are obvious. Darker than the card in dark mode, lighter in light mode —
   flat translucent fills, no shadow. */
.audio{margin-top:20px; border-radius:var(--radius-card); padding:15px 16px 13px;
  background:rgba(0,0,0,0.30); border:1px solid rgba(var(--accent-rgb),0.30);}
:root[data-theme="light"] .audio{background:rgba(255,255,255,0.62);
  border-color:rgba(var(--accent-text-rgb),0.24);}
.audio-top{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
.audio-ttl{font-size:13px; font-weight:500; color:var(--accent-ink); flex:1;}
.rate{font-family:inherit; font-size:12.5px; font-weight:500; padding:5px 12px;
  min-height:32px; border-radius:var(--radius-pill); cursor:pointer;
  background:transparent; color:var(--muted);
  border:1px solid var(--line-strong);}
.rate[aria-pressed="true"]{background:var(--accent); color:var(--accent-text);
  border-color:transparent;}
.rate:focus-visible{outline:2px solid var(--accent-ink); outline-offset:2px;}

.segs{list-style:none; display:flex; flex-direction:column; gap:6px;}
.seg{position:relative; overflow:hidden; width:100%; display:flex; align-items:center;
  gap:12px; text-align:left; font-family:inherit; font-size:14.5px; color:var(--text);
  background:transparent; border:1px solid var(--line); cursor:pointer;
  border-radius:var(--radius-control); padding:9px 13px 9px 9px; min-height:52px;}
.seg:hover{border-color:rgba(var(--accent-rgb),0.45);}
.seg:focus-visible{outline:2px solid var(--accent-ink); outline-offset:2px;}
.seg[aria-pressed="true"]{border-color:rgba(var(--accent-rgb),0.55);
  background:rgba(var(--accent-rgb),0.10);}
/* icon badge, guide spec: bright fill, darkened same-hue ink, 9px radius */
.seg .pl{flex:0 0 auto; width:34px; height:34px; border-radius:var(--radius-badge);
  background:var(--accent); color:var(--accent-text); display:flex;
  align-items:center; justify-content:center; font-size:13px; line-height:1;}
.seg .nm{flex:1; min-width:0;}
.seg .q{color:var(--muted); font-size:13px; margin-left:7px; white-space:nowrap;}
.seg .du{flex:0 0 auto; font-size:13px; color:var(--muted);
  font-variant-numeric:tabular-nums;}
/* progress hairline pinned to the bottom edge of the row */
.seg .bar{position:absolute; left:0; right:0; bottom:0; height:3px;
  background:transparent;}
.seg .bar i{display:block; height:100%; width:0; background:var(--accent);
  transition:width .25s linear;}
.seg.busy .pl{opacity:.55;}
.audio-note{font-size:13px; color:var(--muted); margin-top:11px;
  padding-top:10px; border-top:1px solid var(--line);}
@media (max-width:600px){
  .seg .q{display:block; margin-left:0;}
}

/* ---------- why-this-one callout ---------- */
.finding{background:rgba(var(--accent-rgb),0.12);
  border:1px solid rgba(var(--accent-rgb),0.26);
  border-radius:var(--radius-card); padding:18px 20px; margin:20px 0 0;}
:root[data-theme="light"] .finding{background:rgba(var(--accent-rgb),0.24);
  border-color:rgba(var(--accent-text-rgb),0.22);}
.finding .ft{font-size:12.5px; font-weight:500; color:var(--accent-ink);
  margin-bottom:7px;}
.finding p + p{margin-top:10px;}
.target{margin-top:16px; padding:13px 16px; border-radius:var(--radius-control);
  border:1px dashed rgba(var(--accent-rgb),0.40); font-size:14px; color:var(--muted);}
:root[data-theme="light"] .target{border-color:rgba(var(--accent-text-rgb),0.34);}
.target b{color:var(--accent-ink);}

/* ---------- tracker ---------- */
.trk{width:100%; border-collapse:collapse; margin-top:6px; font-size:14px;}
.trk th,.trk td{padding:10px 4px; border-bottom:1px solid var(--line); text-align:center;}
.trk th:first-child,.trk td:first-child{text-align:left; padding-left:0; min-width:126px;}
.trk thead th{color:var(--muted); font-weight:400; font-size:12.5px;}
/* the footer already draws a rule, so the last row must not draw a second */
.trk tbody tr:last-child td{border-bottom:0;}
/* each row wears its assignment's colour, so the tracker reads as a legend */
.trk td.task{font-weight:500; color:var(--accent-ink);}
.trk input[type="checkbox"]{width:22px; height:22px; accent-color:var(--accent);
  cursor:pointer; margin:0;}
.trkwrap{overflow-x:auto;}
.trk td.na{color:var(--muted); font-size:13px;}
.trk-foot{display:flex; flex-wrap:wrap; align-items:center; gap:14px; margin-top:16px;
  padding-top:14px; border-top:1px solid var(--line);}
.trk-done{font-size:14px; color:var(--muted);}
.trk-done b{color:var(--accent-ink); font-size:16px;}

ul.wins{list-style:none;}
ul.wins li{position:relative; padding:0 0 11px 22px; font-size:15px;}
ul.wins li:last-child{padding-bottom:0;}
ul.wins li::before{content:""; position:absolute; left:0; top:9px; width:7px;
  height:7px; border-radius:50%; background:var(--accent);}

.foot{font-size:12.5px; color:var(--muted); text-align:center; margin-top:14px;}
.btn{font-family:inherit; font-size:14.5px; font-weight:400; padding:11px 20px;
  border:1px solid var(--line-strong); background:transparent; color:var(--text);
  border-radius:var(--radius-control); cursor:pointer; min-height:44px;}
.btn:hover{border-color:var(--accent-ink); color:var(--accent-ink);}
.btn:focus-visible{outline:2px solid var(--accent-ink); outline-offset:2px;}
.themebtn{position:absolute; top:0; right:0; width:42px; height:42px;
  padding:0; font-size:15px;}

@media (max-width:600px){
  .masthead h1{font-size:30px; padding-right:52px;}
  .tile .val{font-size:30px;} .tile.hero .val{font-size:42px;}
  .asg-head h2{font-size:19px;} .card h2{font-size:19px;}
  .card,.asg{padding:19px;}
}
@media print{
  .btn{display:none;}
  .card,.asg,.finding{page-break-inside:avoid;}
}
</style>
</head>
<body>
<div class="wrap">

<div class="masthead">
  <button class="btn themebtn" id="themeToggle" aria-label="Switch to light mode">&#9788;</button>
  <div class="eyebrow">GrammarMetric &middot; TOEIC</div>
  <h1 id="title">This week&rsquo;s homework</h1>
  <div class="who" id="who"></div>
  <div class="rule"></div>
  <div class="chips" id="chips"></div>
</div>

<div class="tiles" id="tiles"></div>

<section class="card" id="why"></section>
<section id="assignments"></section>
<section class="card" id="tracker"></section>
<section class="card" id="bring"></section>

<p class="foot" id="foot"></p>

</div>

<script>
/* ============================================================================
   One week of homework for one student. No answer key and no test content —
   only the student's own per-part percentages, which they have already seen
   on their score report.
   Generated from _build/template.html by _build/build.mjs. Do not edit this
   file directly; edit the template or the student's JSON and rebuild.
   ============================================================================ */
const HW = {"slug":"jeen","nick":"Jeen","class":"3","weekOf":"2026-08-10","weekLabel":"10 August 2026","dailyLoad":"About 30 minutes a day","focus":["Grammar words","Double passages","Listening gist"],"tiles":[{"lbl":"This week","val":"3","sub":"assignments, five days"},{"lbl":"Your estimate now","val":"425<small>–565</small>","sub":"listening 65 · reading 48"},{"lbl":"Your clearest gap","val":"37<small>pts</small>","sub":"grammar words vs vocabulary"}],"why":{"lede":"You have the strongest listening in the group, and something in your results that nobody else managed: you never lost a whole recording. Every single conversation and talk gave you at least one mark. What your test shows is not general weakness — it is two very specific things and one unusual habit. Specific is good. Specific is fixable.","points":[{"label":"Part 5: grammar words vs vocabulary","value":"23% vs 60%","note":"Your vocabulary is a genuine strength. Prepositions, conjunctions and pronouns are not — yet. This is the clearest single gap anyone in the group has."},{"label":"Part 7: one document vs two","value":"68% vs 30%","note":"Single passages are working well. The moment a question spans two documents, it falls away."},{"label":"Reading time used","value":"81 of 75 min","note":"Six minutes over — and the double passages are the last twenty questions on the paper. That may be part of the story above, and we should find out."},{"label":"Where your listening marks fall","value":"50% first, 80% last","note":"The reverse of most students. You catch the detail and miss the frame. Genuinely unusual, and worth a week of attention."}]},"assignments":[{"title":"Grammar words only, fifteen a day","short":"Grammar words","tag":"Reading","dose":"15 items a day","time":"~15 min","days":["Mon","Tue","Wed","Thu","Fri"],"intro":"Not mixed sets this week. Prepositions, conjunctions and relative pronouns, and nothing else.","steps":["<b>Fifteen Part 5 items</b> — only the ones where the four options are grammar words: <i>among / whether / who / despite</i> and friends. Skip the vocabulary and word-form ones.","<b>Answer them.</b>","<b>For each question, write why each of the three wrong options is wrong.</b> All three. This is the actual exercise — the answering part is just setup.","<b>Keep one running list</b> all week of the prepositions that catch you out. Same page, added to each day."],"why":["You got 9 out of 15 vocabulary questions and <b>3 out of 13 grammar-word questions</b> on the same paper. That is a 37-point gap in one part of one section, and it is the clearest thing anyone's test showed.","It is also the one place in this whole group where drilling a single narrow thing beats mixed practice, because the rest of your Part 5 is already working. Step 3 is why: with grammar words the wrong options are wrong for a reason you can actually state out loud, unlike vocabulary where you either know the word or you do not. Say the reason and the rule sticks.","One honest caveat: this is 13 questions on one test. It is enough to act on for a week — it is not enough to rebuild your whole study plan around, so we will check it against your next test before going further."],"target":"23% climbing towards 45%, and a list of at least six prepositions you now know cold."},{"title":"Double passages, twice each","short":"Double passages","tag":"Reading","dose":"2 sets","time":"~40 min total","days":["Tue","Sat"],"intro":"One set untimed early in the week, a different set under the clock later. The order matters — do not swap it.","steps":["<b>Take a double-passage set. No timer.</b> Take as long as you want on this first one.","<b>Before answering, label each of the five questions:</b> text 1, text 2, or both. Just the label, before you go hunting.","<b>Answer, then check</b> — and note whether the ones you missed were the &ldquo;both&rdquo; questions or not. That answer is the whole experiment.","<b>Later in the week, do a second set with a 12-minute timer</b> and compare."],"why":["You scored 68% on single passages and 30% on doubles. There are two quite different explanations and we cannot yet tell them apart: either cross-referencing two documents is genuinely hard for you, or you simply arrived at question 181 with almost no time left, having run six minutes over. Doing one untimed settles it in forty minutes.","The labelling step teaches the mechanic itself. Usually only about one question in a five-question set truly needs both documents — the other four are answerable from one text. Students who know that stop re-reading everything twice.","We have not covered Part 7 in class yet, so treat this as learning something new rather than repairing something broken. A low score on an untaught part is information, not a verdict."],"target":"A clear answer to which of the two causes it is — that is worth more this week than the score itself."},{"title":"Gist first, options covered","short":"Gist listening","tag":"Listening","dose":"5 sets across the week","time":"~10 min each","days":["Mon","Tue","Wed","Thu","Fri"],"intro":"A short one, aimed at the single oddest thing in your results.","audio":["p3-03","p3-06","p3-09","p4-04","p4-08"],"audioTitle":"Five sets — three conversations, two talks","audioNote":"Weighted towards conversations on purpose: your first-question score was 4 out of 10 on Part 3 against 6 out of 10 on Part 4, so that is where the frame is going missing. One a day.","steps":["<b>Cover the questions and the options completely.</b> Paper over the page, or scroll them off screen. Play the recording once.","<b>Say out loud, or write in one sentence:</b> who is talking, where they are, and why they are talking.","<b>Only now uncover the questions</b> and answer them normally.","<b>Check your summary too</b>, not just your answers. Was the situation what you thought it was?"],"why":["You score 80% on the last question of each set and 50% on the first. Almost every student is the other way round, which makes this genuinely your own pattern: you are catching the details but not the situation they sit in.","That matters more than it sounds, because the first question in a Part 3 or Part 4 set is nearly always topic, purpose, or who is speaking. Across the whole listening section that is around twenty marks sitting in one question type you are getting half right.","Covering the options is the part that does the work. With the options visible it is too easy to match a word you heard; with them hidden you have to actually build the picture."],"target":"Your first-question accuracy up from 50% towards 70%, and a summary that matches the recording four times out of five.","clips":[{"id":"p3-03","label":"Conversation 3","q":"47-49","start":168.8,"end":207,"src":"https://grammarmetric.github.io/toeic-pt1/audio/p3.mp3"},{"id":"p3-06","label":"Conversation 6","q":"56-58","start":404.05,"end":440.3,"src":"https://grammarmetric.github.io/toeic-pt1/audio/p3.mp3"},{"id":"p3-09","label":"Conversation 9","q":"65-67","start":628.15,"end":671.45,"src":"https://grammarmetric.github.io/toeic-pt1/audio/p3.mp3"},{"id":"p4-04","label":"Talk 4","q":"80-82","start":280.2,"end":315.55,"src":"https://grammarmetric.github.io/toeic-pt1/audio/p4.mp3"},{"id":"p4-08","label":"Talk 8","q":"92-94","start":616.85,"end":651.95,"src":"https://grammarmetric.github.io/toeic-pt1/audio/p4.mp3"}]}],"bringLede":"Bring these three. The second one especially — it answers a question I cannot answer without you.","bring":["Your running list of prepositions from the grammar-word sets","The labelled double-passage set, and whether doing it untimed actually helped","Two of your gist summaries — one that was right and one that was wrong"]};

/* Assignment accents, in order. Page chrome stays orange, so these three are
   the only other hues on the page and each one owns exactly one assignment. */
const ACCENTS = ["yellow", "cyan", "magenta"];
const accentOf = (a, i) => a.accent || ACCENTS[i % ACCENTS.length];

const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const mmss = s => Math.floor(s/60) + ":" + String(Math.round(s%60)).padStart(2,"0");

/* ---------- audio ----------
   Clips are ranges inside the full Part 3 / Part 4 recordings, which are
   served from the already-public PT1 deployment rather than copied in here.
   Every clip starts on the spoken announcement ("Questions 44 through 46
   refer to the following conversation"), so a student always hears which one
   they are on. Times come from _build/audio-pt1.json. */
function audioBlock(a){
  if (!a.clips || !a.clips.length) return "";
  return '<div class="audio">' +
    '<div class="audio-top"><span class="audio-ttl">' +
      esc(a.audioTitle || "The recordings for this task") + "</span>" +
      '<button class="rate" aria-pressed="false" title="Slow the audio to three-quarter speed">0.75&times;</button>' +
    "</div><ul class=\"segs\">" +
    a.clips.map(c =>
      '<li><button class="seg" aria-pressed="false" data-src="' + esc(c.src) + '"' +
        ' data-start="' + c.start + '" data-end="' + c.end + '">' +
        '<span class="pl">&#9654;</span>' +
        '<span class="nm">' + esc(c.label) +
          '<span class="q">Q' + esc(c.q) + "</span></span>" +
        '<span class="du">' + mmss(c.end - c.start) + "</span>" +
        '<span class="bar"><i></i></span>' +
      "</button></li>").join("") +
    "</ul>" +
    (a.audioNote ? '<p class="audio-note">' + a.audioNote + "</p>" : "") +
  "</div>";
}

/* One <audio> per source file, reused across every clip that points at it, so
   switching clips inside one part never re-downloads 13 minutes of mp3. */
const players = new Map();
function playerFor(src){
  if (!players.has(src)) {
    const el = new Audio();
    el.preload = "metadata";
    el.src = src;
    players.set(src, el);
  }
  return players.get(src);
}

/* Deliberately NOT persisted. Several tasks open with a normal-speed
   exam-conditions listen, and a 0.75x left over from yesterday would silently
   undo that without the student noticing. Slow is a choice you make each time.
   All three pages also share one origin on grammarmetric.github.io, so a
   stored value would follow a student across every page there. */
let rate = 1;

let active = null;          // the <button> currently playing
function stopActive(){
  if (!active) return;
  const el = playerFor(active.dataset.src);
  el.pause();
  active.setAttribute("aria-pressed", "false");
  active.classList.remove("busy");
  active.querySelector(".pl").innerHTML = "&#9654;";
  active.querySelector(".bar i").style.width = "0";
  active = null;
}

function playSeg(btn){
  const src = btn.dataset.src;
  const start = parseFloat(btn.dataset.start), end = parseFloat(btn.dataset.end);
  const el = playerFor(src);
  stopActive();
  active = btn;
  btn.setAttribute("aria-pressed", "true");
  btn.classList.add("busy");
  btn.querySelector(".pl").innerHTML = "&#9646;&#9646;";
  el.playbackRate = rate;

  const begin = () => {
    /* Seeking before metadata exists is silently ignored, which used to look
       like "the button does nothing on first tap". */
    el.currentTime = start;
    el.play().then(() => btn.classList.remove("busy"))
             .catch(() => { stopActive(); });
  };
  if (el.readyState >= 1) begin();
  else el.addEventListener("loadedmetadata", begin, { once: true });

  const tick = () => {
    if (active !== btn) return;
    if (el.currentTime >= end) { stopActive(); return; }
    const pctDone = Math.max(0, Math.min(1, (el.currentTime - start) / (end - start)));
    btn.querySelector(".bar i").style.width = (pctDone * 100) + "%";
  };
  el.removeEventListener("timeupdate", el._tick || (() => {}));
  el._tick = tick;
  el.addEventListener("timeupdate", tick);
}

function wireAudio(root){
  root.querySelectorAll(".seg").forEach(btn => btn.addEventListener("click", () => {
    if (active === btn) stopActive(); else playSeg(btn);
  }));
  root.querySelectorAll(".rate").forEach(btn => {
    const sync = () => {
      const slow = rate !== 1;
      btn.setAttribute("aria-pressed", slow ? "true" : "false");
      root.querySelectorAll(".rate").forEach(o => o.setAttribute("aria-pressed", slow ? "true" : "false"));
    };
    btn.addEventListener("click", () => {
      rate = rate === 1 ? 0.75 : 1;
      players.forEach(el => el.playbackRate = rate);
      sync();
    });
    sync();
  });
}

/* ---------- the assignments ---------- */

/* ---------- tracker ----------
   Ticks live in this browser only, like the lesson pages. A different phone or
   a cleared cache starts fresh, so the page says so rather than losing work
   silently. */
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const KEY  = "gm_hw_" + HW.slug + "_" + HW.weekOf;
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e) { state = {}; }

const totalBoxes = HW.assignments.reduce((n,a) => n + a.days.length, 0);

document.getElementById("tracker").innerHTML =
  "<h2>Tick it off</h2>" +
  '<p class="lede">One tick per session. Ticks are saved in this browser only, ' +
  "so use the same phone or laptop each time.</p>" +
  '<div class="trkwrap"><table class="trk"><thead><tr><th>Task</th>' +
    DAYS.map(d => "<th>" + d + "</th>").join("") + "</tr></thead><tbody>" +
  HW.assignments.map((a,i) =>
    '<tr data-accent="' + accentOf(a,i) + '"><td class="task">' + esc(a.short) + "</td>" +
    DAYS.map(d => a.days.indexOf(d) === -1
      ? '<td class="na">&ndash;</td>'
      : '<td><input type="checkbox" data-k="' + i + d + '" aria-label="' +
        esc(a.short) + ", " + d + '"></td>').join("") +
    "</tr>").join("") +
  "</tbody></table></div>" +
  '<div class="trk-foot"><span class="trk-done" id="trkDone"></span>' +
  '<button class="btn" id="trkReset">Clear this week</button></div>';

const boxes = [...document.querySelectorAll(".trk input")];
function paint(){
  boxes.forEach(b => { b.checked = !!state[b.dataset.k]; });
  const n = boxes.filter(b => b.checked).length;
  document.getElementById("trkDone").innerHTML =
    "<b>" + n + " of " + totalBoxes + "</b> sessions done";
}
boxes.forEach(b => b.addEventListener("change", () => {
  state[b.dataset.k] = b.checked;
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {}
  paint();
}));
document.getElementById("trkReset").addEventListener("click", () => {
  state = {};
  try { localStorage.removeItem(KEY); } catch(e) {}
  paint();
});
paint();

document.getElementById("bring").innerHTML =

/* ---------- theme toggle ---------- */
const tbtn = document.getElementById("themeToggle");
function syncBtn(){
  const dark = document.documentElement.getAttribute("data-theme") === "dark";
  tbtn.textContent = dark ? "☼" : "☾";
  tbtn.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
}
tbtn.addEventListener("click", () => {
  const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("gm_theme", next); } catch(e) {}
  syncBtn();
});
syncBtn();
</script>
